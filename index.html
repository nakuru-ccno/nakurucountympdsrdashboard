<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MPDSR Nakuru County Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/nakurucountympdsrdashboard/style.css" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        /* Ensure the root elements fully fill the viewport */
        html, body, #root { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
        }
    </style>
</head>

<body class="font-sans bg-gray-100 h-full">

    <div id="root" class="h-full w-full">
        <div class="login-page">
            <div class="login-card" style="text-align: center;">
                <p class="login-title" style="color: var(--color-primary);">Initializing MPDSR...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

        // !! IMPORTANT !!
        // Replace these placeholder values with your actual Supabase URL and Anon Key.
        window.supabase = createClient(
            "https://YOUR-SUPABASE-PROJECT-ID.supabase.co",
            "YOUR-SUPABASE-ANON-KEY"
        );
    </script>

    <script type="module" src="/nakurucountympdsrdashboard/signup.js"></script>
    <script type="module" src="/nakurucountympdsrdashboard/script.js"></script> 

</body>
</html>
