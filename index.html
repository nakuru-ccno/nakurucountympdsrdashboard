<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPDSR Nakuru County Dashboard</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load React, ReactDOM, and Babel for JSX in-browser compilation -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        // Configure Tailwind to use 'Inter' font
        tailwind.config = {
          theme: {
            extend: {
              fontFamily: {
                sans: ['Inter', 'sans-serif'],
              },
            },
          }
        }
    </script>
    <style>
        /* Ensures the whole screen is used and removes default margins */
        html, body, #root {
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body class="font-sans bg-gray-100">

<div id="root" class="h-full">
    <!-- React app will render here -->
</div>

<!-- 
    *** This is the functional equivalent of your script.js file ***
    All application logic is contained within this single block.
-->
<script type="text/babel">
const { useState, useEffect, useMemo } = React;
// Icon components imported as inline SVGs for single-file compatibility
const Home = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
const ListChecks = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 16 2 2 4-4"/><path d="M12 6h8"/><path d="M12 12h8"/><path d="M12 18h8"/><path d="M3 6l2 2 4-4"/></svg>;
const Users = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
const Shield = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>;
const LogOut = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>;
const Menu = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="3" x2="21" y1="12" y2="12"/><line x1="3" x2="21" y1="6" y2="6"/><line x1="3" x2="21" y1="18" y2="18"/></svg>;
const Plus = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 5v14"/><path d="M5 12h14"/></svg>;
const X = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;


// ** Required Global Variable Setup (Mocked for Supabase project) **
const appId = 'default-app-id';
const firebaseConfig = {};
// -------------------------------------------------------------------

// --- 1. MOCK DATA ---

const mockCases = [
  { id: 'MPDSR-001', facility: 'Nakuru Referral Hospital', subcounty: 'Nakuru Town East', type: 'Maternal', status: 'Pending Review', date: '2025-10-01' },
  { id: 'MPDSR-002', facility: 'Gilgil Sub-County Hospital', subcounty: 'Gilgil', type: 'Perinatal', status: 'Audit Complete', date: '2025-09-25' },
  { id: 'MPDSR-003', facility: 'Rongai Health Centre', subcounty: 'Rongai', type: 'Maternal', status: 'Data Entry', date: '2025-10-05' },
  { id: 'MPDSR-004', facility: 'Molo County Hospital', subcounty: 'Molo', type: 'Perinatal', status: 'Pending Review', date: '2025-10-08' },
  { id: 'MPDSR-005', facility: 'Naivasha Sub-County Hospital', subcounty: 'Naivasha', type: 'Maternal', status: 'Audit Complete', date: '2025-09-15' },
  { id: 'MPDSR-006', facility: 'Ol Kalou Health Center', subcounty: 'Nakuru Town West', type: 'Perinatal', status: 'Pending Review', date: '2025-10-10' },
  { id: 'MPDSR-007', facility: 'Egerton University Clinic', subcounty: 'Njoro', type: 'Maternal', status: 'Data Entry', date: '2025-10-12' },
];

const subCounties = ['Nakuru Town East', 'Gilgil', 'Rongai', 'Molo', 'Naivasha', 'Nakuru Town West', 'Njoro'];
const caseTypes = ['Maternal', 'Perinatal'];
const caseStatuses = ['Data Entry', 'Pending Review', 'Audit Complete', 'Closed'];

const getStatusColor = (status) => {
  switch (status) {
    case 'Pending Review': return 'bg-yellow-100 text-yellow-800';
    case 'Audit Complete': return 'bg-green-100 text-green-800';
    case 'Data Entry': return 'bg-blue-100 text-blue-800';
    default: return 'bg-gray-100 text-gray-800';
  }
};

// --- 2. MOCK SUPABASE AUTH & DATA CONTEXT ---
// This hook simulates fetching user information and their assigned RLS user_level.
const useSupabaseAuth = () => {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    // Simulate initial authentication and profile fetch delay (1 second)
    setLoading(true);

    // Mock User Data with a profile containing the RLS level we discussed
    const mockUser = {
      id: 'a1b2c3d4-e5f6-7g8h-9i0j-k1l2m3n4o5p6',
      email: 'county.admin@nakuru.go.ke',
      user_level: 'County', // Simulating a County-level user for initial testing
    };

    setTimeout(() => {
      setUser(mockUser);
      setLoading(false);
    }, 1000);
  }, []);

  // Placeholder for a sign-out function
  const signOut = () => {
    setUser(null);
    setLoading(false);
  };

  return { user, loading, signOut };
};

// --- 3. COMPONENTS ---

// Navigation Item component for the sidebar
const NavItem = ({ icon: Icon, title, onClick, isActive, isCollapsed }) => (
  <button
    onClick={onClick}
    className={`
      flex items-center w-full p-3 my-1 transition duration-200 rounded-lg
      ${isActive ? 'bg-indigo-600 text-white shadow-lg' : 'text-indigo-200 hover:bg-indigo-700'}
    `}
  >
    <Icon className="w-5 h-5" />
    {!isCollapsed && <span className="ml-3 font-medium">{title}</span>}
  </button>
);

// Sidebar Component
const Sidebar = ({ currentView, setCurrentView, user, isCollapsed, setIsCollapsed }) => {
  const navItems = [
    { name: 'Dashboard', icon: Home, view: 'dashboard' },
    { name: 'Case List', icon: ListChecks, view: 'cases' },
    { name: 'Reports', icon: Shield, view: 'reports' },
    { name: 'User Management', icon: Users, view: 'users', requiresAdmin: true },
  ];

  return (
    <div className={`
      h-full bg-indigo-800 text-white shadow-xl transition-all duration-300
      ${isCollapsed ? 'w-20' : 'w-64'}
      flex flex-col flex-shrink-0
    `}>
      <div className="flex items-center justify-between p-4 border-b border-indigo-700">
        {!isCollapsed && (
          <h1 className="text-xl font-bold text-white tracking-wider">MPDSR Nakuru</h1>
        )}
        <button
          onClick={() => setIsCollapsed(!isCollapsed)}
          className="p-2 rounded-full hover:bg-indigo-700 text-indigo-200"
          aria-label="Toggle Sidebar"
        >
          <Menu className="w-6 h-6" />
        </button>
      </div>

      <nav className="flex-grow p-3 space-y-1 overflow-y-auto">
        {navItems.map((item) => {
          // Conditional rendering based on mock user_level. Only 'National' can see User Mgmt.
          if (item.requiresAdmin && user.user_level !== 'National') {
            // For now, only show user management for 'National' level in the mock.
            return null;
          }
          return (
            <NavItem
              key={item.view}
              icon={item.icon}
              title={item.name}
              onClick={() => setCurrentView(item.view)}
              isActive={currentView === item.view}
              isCollapsed={isCollapsed}
            />
          );
        })}
      </nav>

      {/* User Info and Logout */}
      <div className={`p-4 border-t border-indigo-700 ${isCollapsed ? 'text-center' : ''}`}>
        {!isCollapsed && (
          <div className="text-sm font-semibold mb-2 truncate">
            {user.email}
          </div>
        )}
        <div className={`text-xs text-indigo-300 mb-3 ${isCollapsed ? 'hidden' : ''}`}>
          Level: <span className="font-bold text-indigo-100">{user.user_level}</span>
        </div>
        <button
          className={`flex items-center justify-center w-full p-2 text-sm transition duration-200 rounded-lg text-red-300 bg-indigo-700 hover:bg-red-600 hover:text-white ${isCollapsed ? 'px-1' : ''}`}
        >
          <LogOut className="w-5 h-5" />
          {!isCollapsed && <span className="ml-2">Logout</span>}
        </button>
      </div>
    </div>
  );
};

// New Case Entry Modal Component
const NewCaseModal = ({ isVisible, onClose, onSave }) => {
  if (!isVisible) return null;

  const [caseData, setCaseData] = useState({
    facility: '',
    subcounty: subCounties[0],
    type: caseTypes[0],
    date: new Date().toISOString().substring(0, 10),
  });

  const handleChange = (e) => {
    setCaseData({ ...caseData, [e.target.name]: e.target.value });
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    onSave(caseData);
    onClose();
  };

  // Generic Input Field Component
  const InputField = ({ label, name, type = 'text', value, onChange, options = [] }) => {
    const baseClasses = "w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150";
    
    return (
      <div className="mb-4">
        <label className="block text-sm font-medium text-gray-700 mb-1">{label}</label>
        {options.length > 0 ? (
          <select 
            name={name} 
            value={value} 
            onChange={onChange} 
            className={baseClasses}
          >
            {options.map(opt => <option key={opt} value={opt}>{opt}</option>)}
          </select>
        ) : (
          <input 
            type={type} 
            name={name} 
            value={value} 
            onChange={onChange} 
            className={baseClasses} 
            required
          />
        )}
      </div>
    );
  };
  
  return (
    <div className="fixed inset-0 bg-gray-900 bg-opacity-75 z-50 flex justify-center items-center p-4" onClick={onClose}>
      <div 
        className="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden transform transition-all duration-300 scale-100"
        onClick={e => e.stopPropagation()} // Prevent closing when clicking inside
      >
        <div className="p-6 border-b border-gray-200 flex justify-between items-center">
          <h2 className="text-2xl font-bold text-gray-800">New MPDSR Case Registration</h2>
          <button onClick={onClose} className="text-gray-400 hover:text-gray-700 transition">
            <X className="w-6 h-6" />
          </button>
        </div>
        
        <form onSubmit={handleSubmit} className="p-6 space-y-4">
          <p className="text-sm text-gray-500">
            Please enter the initial details for the maternal or perinatal death.
          </p>

          <InputField 
            label="Facility Name" 
            name="facility" 
            value={caseData.facility} 
            onChange={handleChange} 
          />

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <InputField 
              label="Sub-County" 
              name="subcounty" 
              value={caseData.subcounty} 
              onChange={handleChange} 
              options={subCounties}
            />
            <InputField 
              label="Case Type" 
              name="type" 
              value={caseData.type} 
              onChange={handleChange} 
              options={caseTypes}
            />
          </div>

          <InputField 
            label="Date of Event" 
            name="date" 
            type="date" 
            value={caseData.date} 
            onChange={handleChange} 
          />
          
          <div className="pt-4 flex justify-end space-x-3">
            <button 
              type="button" 
              onClick={onClose} 
              className="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-200 rounded-lg hover:bg-gray-300 transition"
            >
              Cancel
            </button>
            <button 
              type="submit" 
              className="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg shadow-md hover:bg-indigo-700 transition"
            >
              Register Case
            </button>
          </div>
        </form>
      </div>
    </div>
  );
};


const DashboardView = ({ user }) => (
  <div className="p-6">
    <h1 className="text-3xl font-bold text-gray-800 mb-6">MPDSR Overview</h1>
    <div className="bg-white p-6 rounded-xl shadow-lg border-l-4 border-indigo-500">
      <p className="text-gray-600">Welcome, **{user.user_level}** User ({user.email}).</p>
      <p className="mt-2 text-gray-700 font-medium">
        This view is restricted to show data only for your assigned jurisdiction based on RLS.
        Current access: **Nakuru County** (Simulated).
      </p>
    </div>
    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mt-6">
      {['Maternal Deaths', 'Perinatal Deaths', 'Case Audits', 'Facilities'].map((title, i) => (
        <div key={i} className="bg-white p-5 rounded-xl shadow-md transition hover:shadow-xl">
          <p className="text-sm text-indigo-500 font-semibold">{title}</p>
          <p className="text-3xl font-extrabold text-gray-900 mt-1">{i * 25 + 10}</p>
          <p className="text-xs text-gray-500 mt-1">Total count for this period</p>
        </div>
      ))}
    </div>
  </div>
);

const CaseListView = () => {
  const [cases, setCases] = useState(mockCases);
  const [isModalOpen, setIsModalOpen] = useState(false);
  
  // Function to handle saving the new case (mock implementation)
  const handleSaveNewCase = (newCaseData) => {
    const newId = `MPDSR-${String(cases.length + 1).padStart(3, '0')}`;
    const newCase = {
      id: newId,
      status: 'Data Entry',
      ...newCaseData
    };
    console.log('New case registered:', newCase);
    setCases([newCase, ...cases]);
  };

  return (
    <div className="p-6">
      <div className="flex justify-between items-center mb-6">
        <h1 className="text-3xl font-bold text-gray-800">Maternal & Perinatal Case Listing</h1>
        <button 
          onClick={() => setIsModalOpen(true)}
          className="flex items-center px-4 py-2 bg-indigo-600 text-white font-semibold rounded-lg shadow-md hover:bg-indigo-700 transition duration-150"
        >
          <Plus className="w-5 h-5 mr-2" />
          Add New Case
        </button>
      </div>
      
      {/* Search/Filter Bar */}
      <div className="bg-white p-4 rounded-xl shadow-md mb-6 flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-4">
        <input 
          type="text" 
          placeholder="Search by Case ID or Facility..."
          className="flex-grow p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500"
        />
        <select className="p-2 border border-gray-300 rounded-lg">
            <option>All Sub-Counties</option>
            {subCounties.map(sub => <option key={sub} value={sub}>{sub}</option>)}
        </select>
        <select className="p-2 border border-gray-300 rounded-lg">
            <option>All Statuses</option>
            {caseStatuses.map(status => <option key={status} value={status}>{status}</option>)}
        </select>
      </div>

      <div className="bg-white rounded-xl shadow-lg overflow-x-auto">
        <table className="min-w-full divide-y divide-gray-200">
          <thead className="bg-gray-50">
            <tr>
              {['Case ID', 'Facility', 'Sub-County', 'Type', 'Date', 'Status', 'Actions'].map((header) => (
                <th
                  key={header}
                  className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                >
                  {header}
                </th>
              ))}
            </tr>
          </thead>
          <tbody className="bg-white divide-y divide-gray-200">
            {cases.map((caseItem) => (
              <tr key={caseItem.id} className="hover:bg-indigo-50 transition duration-150">
                <td className="px-6 py-4 whitespace-nowrap text-sm font-medium text-indigo-600">{caseItem.id}</td>
                <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{caseItem.facility}</td>
                <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{caseItem.subcounty}</td>
                <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{caseItem.type}</td>
                <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{caseItem.date}</td>
                <td className="px-6 py-4 whitespace-nowrap">
                  <span className={`px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${getStatusColor(caseItem.status)}`}>
                    {caseItem.status}
                  </span>
                </td>
                <td className="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                  <button 
                    className="text-indigo-600 hover:text-indigo-900 transition mr-3 font-semibold"
                    onClick={() => console.log('Viewing case:', caseItem.id)}
                  >
                    View
                  </button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
        
        {/* RLS Reminder */}
        <div className="p-4 bg-gray-50 border-t border-gray-200 text-sm text-red-500 font-medium rounded-b-xl">
          **RLS Protection in Effect:** The above list is filtered to Nakuru County (Simulated).
        </div>
      </div>
      
      {/* New Case Modal */}
      <NewCaseModal
        isVisible={isModalOpen}
        onClose={() => setIsModalOpen(false)}
        onSave={handleSaveNewCase}
      />
    </div>
  );
};

const ReportsView = () => (
  <div className="p-6">
    <h1 className="text-3xl font-bold text-gray-800 mb-6">Interactive Reports & Visualizations</h1>
    <div className="bg-white p-6 rounded-xl shadow-lg">
      <p className="text-gray-600">Charts and data analytics will be placed here.</p>
      <p className="mt-2 text-sm text-blue-500">Charts will aggregate and display data according to RLS constraints (County level data).</p>
    </div>
  </div>
);

const UserManagementView = () => (
  <div className="p-6">
    <h1 className="text-3xl font-bold text-gray-800 mb-6">User and Role Administration</h1>
    <div className="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-800 p-4 rounded-xl shadow-lg">
      <p className="font-bold">Access Warning:</p>
      <p className="text-sm">This module is typically restricted to 'National' or 'Admin' level users via RLS policies on the `user_profiles` table.</p>
    </div>
  </div>
);

// --- 4. MAIN APPLICATION ---
const App = () => {
  const { user, loading } = useSupabaseAuth();
  const [currentView, setCurrentView] = useState('dashboard');
  const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(false);

  const renderContent = useMemo(() => {
    if (loading) {
      return (
        <div className="flex items-center justify-center flex-grow h-screen">
          <div className="flex flex-col items-center p-6 bg-white rounded-xl shadow-lg">
            <svg className="animate-spin h-8 w-8 text-indigo-600 mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
              <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p className="text-lg font-medium text-gray-700">Loading User Profile and RLS Configuration...</p>
          </div>
        </div>
      );
    }

    if (!user) {
      // In a real application, this would redirect to a login screen
      return (
        <div className="flex items-center justify-center flex-grow h-screen">
          <div className="p-10 bg-white rounded-xl shadow-2xl text-center">
            <h1 className="text-2xl font-bold text-red-600 mb-4">Access Denied</h1>
            <p className="text-gray-600">Please log in to access the MPDSR Dashboard.</p>
            <button className="mt-4 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">Go to Login (Mock)</button>
          </div>
        </div>
      );
    }

    switch (currentView) {
      case 'dashboard':
        return <DashboardView user={user} />;
      case 'cases':
        return <CaseListView />;
      case 'reports':
        return <ReportsView />;
      case 'users':
        return <UserManagementView />;
      default:
        return <DashboardView user={user} />;
    }
  }, [loading, user, currentView]);

  return (
    <div className="flex h-screen overflow-hidden">
      {user && (
        <Sidebar
          currentView={currentView}
          setCurrentView={setCurrentView}
          user={user}
          isCollapsed={isSidebarCollapsed}
          setIsCollapsed={setIsSidebarCollapsed}
        />
      )}
      <main className="flex-grow overflow-y-auto transition-all duration-300">
        {renderContent}
      </main>
    </div>
  );
};

// Render the application into the root element
const container = document.getElementById('root');
const root = ReactDOM.createRoot(container);
root.render(<App />);

</script>
</body>
</html>
